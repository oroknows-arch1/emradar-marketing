name: Marketing repair regression
on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'tests/runtime/**'
      - '.github/workflows/marketing-repair-regression.yml'
permissions:
  contents: read
jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/runtime/owner-preview-campaigns.test.js tests/runtime/editorial-email.test.js tests/runtime/autonomous-source.test.js
